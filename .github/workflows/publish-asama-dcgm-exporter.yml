# Asama-only. Builds asama-dcgm-exporter. Does not replace go.yml.
name: Publish asama-dcgm-exporter

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-test[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Asama version: X.Y.Z or X.Y.Z-testN. Upstream comes from EXPORTER_VERSION in hack/versions.env."
        required: true

permissions:
  contents: write
  packages: read

# One publish at a time.
concurrency:
  group: publish-asama-dcgm-exporter
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    # A manual run pushes the release tag with the Actions token. Skip that
    # follow-up tag push so the same version is not built twice.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Derive package versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # shellcheck disable=SC1091
          source hack/versions.env
          upstream="${EXPORTER_VERSION:?EXPORTER_VERSION missing from hack/versions.env}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          # Tag is the Asama version. Upstream is EXPORTER_VERSION from this commit.
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-test([0-9]+))?$ ]]; then
            echo "ERROR: version '$version' must be X.Y.Z or X.Y.Z-testN (tag ${tag})"
            exit 1
          fi
          asama="${BASH_REMATCH[1]}"
          # ~ sorts before the final release in dpkg and RPM. A bare tilde is a home path.
          tilde='~'
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            channel=test
            asama_full="${asama}${tilde}test${BASH_REMATCH[3]}"
          else
            channel=production
            asama_full="$asama"
          fi

          # Package name is asama-dcgm-exporter. Version is upstream plus the Asama
          # version. Debian revision stays -1. Test vs production is the apt component
          # and the rpm repo.
          echo "DEB_REPOSITORY=deb" >> "$GITHUB_ENV"
          echo "DEB_SUITE=generic" >> "$GITHUB_ENV"
          if [ "$channel" = test ]; then
            echo "DEB_COMPONENT=test" >> "$GITHUB_ENV"
            echo "RPM_REPOSITORY=rpm-test" >> "$GITHUB_ENV"
          else
            echo "DEB_COMPONENT=main" >> "$GITHUB_ENV"
            echo "RPM_REPOSITORY=rpm" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "DEB_VERSION=${upstream}-${asama_full}" >> "$GITHUB_ENV"
          echo "RPM_VERSION=${upstream}" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=${asama_full}" >> "$GITHUB_ENV"
          echo "Publishing ${tag} upstream=${upstream} deb=${upstream}-${asama_full}-1"

      - name: Reserve release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # Claim the tag before the build so a later run cannot reuse it.
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "ERROR: tag ${RELEASE_TAG} already exists"
            exit 1
          fi
          git tag "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install package tooling
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg binutils jq

      - name: create build directory
        run: mkdir -p build/bin

      - name: Build DCGM Exporter
        run: |
          set -euo pipefail
          go mod verify
          make binary
          mv cmd/dcgm-exporter/dcgm-exporter build/bin/
          ./build/bin/dcgm-exporter --version
          asama-packaging/scripts/asama_strip_dcgm.sh "${GITHUB_WORKSPACE}"

      - name: Prepare dcgm-exporter DEB package
        run: |
          set -euo pipefail
          DEB_DIR="deb/asama-dcgm-exporter_${DEB_VERSION}-1_amd64"
          asama-packaging/deb/make-deb.sh "$DEB_DIR"
          mkdir -p "$DEB_DIR/DEBIAN"
          cp asama-packaging/deb/postinst "$DEB_DIR/DEBIAN/postinst"
          cp asama-packaging/deb/prerm "$DEB_DIR/DEBIAN/prerm"
          chmod 0755 "$DEB_DIR/DEBIAN/postinst" "$DEB_DIR/DEBIAN/prerm"
          sed "s/_VERSION_/${DEB_VERSION}-1/" asama-packaging/deb/control > "$DEB_DIR/DEBIAN/control"
          # Files under /opt are not conffiles unless listed. Keep operator edits on upgrade.
          # Paths stay unindented in the package file. A heredoc here would break workflow YAML.
          printf '%s\n' \
            /opt/asama.ai/config/dcgm-counters-identity.csv \
            /opt/asama.ai/config/dcgm-counters-health.csv \
            /opt/asama.ai/config/dcgm-counters-analysis.csv \
            /opt/asama.ai/config/dcgm-exporter-identity.env \
            /opt/asama.ai/config/dcgm-exporter-health.env \
            /opt/asama.ai/config/dcgm-exporter-analysis.env \
            > "$DEB_DIR/DEBIAN/conffiles"

      - name: Build dcgm-exporter DEB
        run: dpkg-deb --build "deb/asama-dcgm-exporter_${DEB_VERSION}-1_amd64"

      - name: Prepare and build DCGM RPM
        run: |
          set -euo pipefail
          mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          cp build/bin/dcgm-exporter ~/rpmbuild/SOURCES/
          cp asama-packaging/systemd/asama-dcgm-exporter.service ~/rpmbuild/SOURCES/
          cp asama-packaging/systemd/asama-dcgm-exporter@.service ~/rpmbuild/SOURCES/
          cp asama-packaging/systemd/asama-nv-hostengine.service ~/rpmbuild/SOURCES/
          cp asama-packaging/scripts/configure-hostengine.sh ~/rpmbuild/SOURCES/asama-dcgm-configure-hostengine
          cp asama-packaging/config/dcgm-counters-*.csv asama-packaging/config/dcgm-exporter-*.env ~/rpmbuild/SOURCES/
          sed -e "s/_RPM_VERSION_/${RPM_VERSION}/" -e "s/_RPM_RELEASE_/${RPM_RELEASE}/" \
            asama-packaging/rpm/asama-dcgm-exporter.spec > ~/rpmbuild/SPECS/asama-dcgm-exporter.spec
          (cd ~/rpmbuild/SPECS && rpmbuild -ba asama-dcgm-exporter.spec)
          rpm -qlp ~/rpmbuild/RPMS/x86_64/asama-dcgm-exporter-${RPM_VERSION}-${RPM_RELEASE}*.x86_64.rpm

      - name: Configure RPM signing
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          RPM_GPG_NAME: ${{ secrets.RPM_GPG_NAME || secrets.GPG_NAME }}
        run: |
          if [ -z "${RPM_GPG_PRIVATE_KEY:-}" ]; then
            echo "No RPM GPG key in this repo secrets; skip signing"
            exit 0
          fi
          asama-packaging/scripts/configure-rpm-signing.sh
          find ~/rpmbuild/RPMS -name '*.rpm' -print0 | xargs -0 -r -n1 rpmsign --addsign
          find ~/rpmbuild/RPMS -name '*.rpm' -print0 | xargs -0 -r -n1 sudo rpm --checksig

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asama-dcgm-exporter-packages
          path: |
            deb/asama-dcgm-exporter_${{ env.DEB_VERSION }}-1_amd64.deb
            /home/runner/rpmbuild/RPMS/x86_64/asama-dcgm-exporter-${{ env.RPM_VERSION }}-${{ env.RPM_RELEASE }}*.x86_64.rpm

      - name: Upload packages to existing repositories
        env:
          ASAMA_REPO_USERNAME: ${{ secrets.ASAMA_REPO_USERNAME }}
          ASAMA_REPO_PASSWORD: ${{ secrets.ASAMA_REPO_PASSWORD }}
        run: |
          # deb, rpm, and rpm-test already exist. Upload, then publish.
          shopt -s nullglob
          rpms=(/home/runner/rpmbuild/RPMS/x86_64/asama-dcgm-exporter-"${RPM_VERSION}"-"${RPM_RELEASE}"*.x86_64.rpm)
          if [ "${#rpms[@]}" -ne 1 ]; then
            echo "expected one rpm, found ${#rpms[@]}" >&2
            exit 1
          fi
          asama-packaging/scripts/repo-upload.sh deb "$DEB_REPOSITORY" \
            "deb/asama-dcgm-exporter_${DEB_VERSION}-1_amd64.deb" \
            "$DEB_SUITE" "$DEB_COMPONENT"
          asama-packaging/scripts/repo-upload.sh rpm "$RPM_REPOSITORY" "${rpms[0]}"

      - name: Attach artifacts to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: |
            deb/asama-dcgm-exporter_${{ env.DEB_VERSION }}-1_amd64.deb
            /home/runner/rpmbuild/RPMS/x86_64/asama-dcgm-exporter-${{ env.RPM_VERSION }}-${{ env.RPM_RELEASE }}*.x86_64.rpm
